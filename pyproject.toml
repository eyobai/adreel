[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "adreel"
version = "0.1.0"
description = "AI video editing for small businesses: raw phone clips in, branded 9:16 Amharic-captioned reels out."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "PyYAML>=6.0",
    "typer>=0.12",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Face-aware 9:16 reframing. Without it the renderer falls back to centre/focus crops.
face = ["mediapipe>=0.10.14", "numpy>=1.26"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
adreel = "adreel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/adreel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "ffmpeg: integration tests that shell out to ffmpeg/ffprobe (skipped if missing)",
    "face: tests that need mediapipe",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Ethiopic/full-width characters are intentional

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
[[tool.mypy.overrides]]
module = ["mediapipe.*"]
ignore_missing_imports = true
