# Local development stack: Postgres, Redis, migrations, bot, worker
# (+ optional self-hosted Telegram Bot API server).
#
#   cp .env.example .env    # set ADREEL_TELEGRAM_BOT_TOKEN and the AI keys
#   docker compose up --build
#
# Large videos (> 20 MB): enable the local Bot API server. It needs an api_id/api_hash
# from https://my.telegram.org, set TELEGRAM_API_ID / TELEGRAM_API_HASH in .env plus
#   ADREEL_TELEGRAM_API_BASE=http://telegram-bot-api:8081
#   ADREEL_TELEGRAM_LOCAL_MODE=true
# and run:  docker compose --profile local-api up --build
# (If the bot was used with api.telegram.org before, call its logOut method once first.)

x-app: &app
  build: .
  image: adreel:dev
  env_file: .env
  environment:
    ADREEL_DATABASE_URL: postgresql://adreel:adreel@postgres:5432/adreel
    ADREEL_REDIS_URL: redis://redis:6379/0
    ADREEL_QUEUE_BACKEND: rq
    ADREEL_STORAGE_BACKEND: ${ADREEL_STORAGE_BACKEND:-local}
    ADREEL_STORAGE_DIR: /data/storage
    ADREEL_WORK_DIR: /data/work
    ADREEL_TELEGRAM_SERVER_FILES_DIR: /var/lib/telegram-bot-api
  volumes:
    - appdata:/data
    - tgfiles:/var/lib/telegram-bot-api:ro
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adreel
      POSTGRES_PASSWORD: adreel
      POSTGRES_DB: adreel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adreel"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["db", "upgrade"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    <<: *app
    command: ["bot"]
    ports:
      - "8080:8080"  # Chapa webhook/callback + /health (put HTTPS in front)
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # one render at a time per worker; scale with: docker compose up --scale worker=2

  telegram-bot-api:
    profiles: ["local-api"]
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - tgfiles:/var/lib/telegram-bot-api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  appdata:
  tgfiles:
